name: Chromatic

# Include shared rendering/data helpers as well as UI code. Keep both path lists in sync.
# Manual dispatch intentionally bypasses the filters.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/app/api/**'
      - '!src/app/blog/api/**'
      - '!src/lib/rateLimit.ts'
      - '!src/**/*.test.*'
      - '!src/**/*.spec.*'
      - 'public/**'
      - 'tests/visual/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'next.config.*'
      - 'next-env.d.ts'
      - 'tsconfig*.json'
      - 'playwright.config.*'
      - 'chromatic.config.*'
      - '.github/workflows/chromatic.yml'
  pull_request:
    paths:
      - 'src/**'
      - '!src/app/api/**'
      - '!src/app/blog/api/**'
      - '!src/lib/rateLimit.ts'
      - '!src/**/*.test.*'
      - '!src/**/*.spec.*'
      - 'public/**'
      - 'tests/visual/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'next.config.*'
      - 'next-env.d.ts'
      - 'tsconfig*.json'
      - 'playwright.config.*'
      - 'chromatic.config.*'
      - '.github/workflows/chromatic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    # Forks cannot access the project token or Supabase build secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture desktop and mobile visual tests
        run: npm run test:visual
      - name: Publish to Chromatic
        run: npm run chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          CHROMATIC_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Upload test report and archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
